# Central de Monitoramento — orquestração local/VPS (arquitetura §6, T1.7).
# Uso: cp .env.example .env && docker compose up --build -d

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: ${DB_PASSWORD:-monitor}
      POSTGRES_DB: monitor
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitor -d monitor"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      ENV: production
      HTTP_ADDR: :8080
      DB_DSN: postgres://monitor:${DB_PASSWORD:-monitor}@postgres:5432/monitor?sslmode=disable
      AUTO_MIGRATE: "true"
      WORKER_POOL_SIZE: ${WORKER_POOL_SIZE:-20}
      POOL_QUEUE_SIZE: ${POOL_QUEUE_SIZE:-1000}
      MAX_BATCH_SIZE: ${MAX_BATCH_SIZE:-100}
      BATCH_FLUSH_SECONDS: ${BATCH_FLUSH_SECONDS:-1}
      SCHEDULER_TICK_SECONDS: ${SCHEDULER_TICK_SECONDS:-10}
      JITTER_FRACTION: ${JITTER_FRACTION:-0.2}
      ALLOW_PRIVATE_TARGETS: ${ALLOW_PRIVATE_TARGETS:-false} # SSRF guard (ver .env.example)
      FAIL_THRESHOLD: ${FAIL_THRESHOLD:-3}
      SUCCESS_THRESHOLD: ${SUCCESS_THRESHOLD:-2}
      SSE_HEARTBEAT_SECONDS: ${SSE_HEARTBEAT_SECONDS:-15}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET obrigatório em produção}
      JWT_TTL_HOURS: ${JWT_TTL_HOURS:-24}
      AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-5}
      AUTH_RATE_WINDOW_SECONDS: ${AUTH_RATE_WINDOW_SECONDS:-60}
      HEADERS_ENC_KEY: ${HEADERS_ENC_KEY:-}
      # S-08 — cotas por conta (429 ao exceder).
      MAX_ENDPOINTS_PER_ACCOUNT: ${MAX_ENDPOINTS_PER_ACCOUNT:-50}
      MIN_CHECK_INTERVAL_SECONDS: ${MIN_CHECK_INTERVAL_SECONDS:-10}
      CHECKS_PER_MONTH_QUOTA: ${CHECKS_PER_MONTH_QUOTA:-0}
      NOTIFY_ENABLED: ${NOTIFY_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      NOTIFY_TO_EMAIL: ${NOTIFY_TO_EMAIL:-}
      NOTIFY_WEBHOOK_URL: ${NOTIFY_WEBHOOK_URL:-}
      NOTIFY_SUPPRESSION_SECONDS: ${NOTIFY_SUPPRESSION_SECONDS:-300}
      NOTIFY_RETRIES: ${NOTIFY_RETRIES:-3}
      NOTIFY_TIMEOUT_SECONDS: ${NOTIFY_TIMEOUT_SECONDS:-5}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    # Health-check do processo via TCP (distroless não tem shell/wget).
    healthcheck:
      test: ["CMD", "/monitor", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata: