# Nginx edge — único ponto de entrada (arquitetura §6.5, T1.8).
# TLS termination + estáticos da status page + proxy /api e SSE.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    upstream monitor_backend {
        server backend:8080;
        keepalive 32; # reaproveita conexões com o Go (latência P95)
    }

    # Servidor HTTP → HTTPS (RNF-016).
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        # TLS (acme.sh/certbot) — dev: certs/ self-signed.
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        # Headers de segurança (RNF-016/RNF-020).
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self'" always;

        # Estáticos da status page (build do frontend — Fase 4).
        location / {
            root /usr/share/nginx/html;
            try_files $uri /index.html; # SPA fallback
            gzip_static on;
            expires 1h;
        }

        # Health-checks do backend (rotas exatas primeiro — o SPA é catch-all).
        location = /healthz {
            proxy_pass http://monitor_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location = /readyz {
            proxy_pass http://monitor_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API REST (status page pública + painel).
        location /api/ {
            proxy_pass http://monitor_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        # SSE — NUNCA bufferizar o stream (RNF-009, arquitetura §4.5).
        location ~ ^/api/events {
            proxy_pass http://monitor_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Accel-Buffering no;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 60s;   # > heartbeat de 15s do backend
            proxy_send_timeout 60s;
        }
    }
}